[package]
name = "markflow"
version = "0.1.1"
description = "Write documents visually, get clean Markdown files."
authors = ["Nahuel"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "markflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = { version = "2.5.1", features = ["watch"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-single-instance = "2"
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3.6.3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
fastembed = { version = "7.1.0", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
rusqlite = { version = "0.38", features = ["bundled"] }
markdown = "1.0"
sha2 = "0.10"
thread-priority = "3.1"
wait-timeout = "0.2"
